[package]
name = "clank-embed"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
# Unpublishable while golem-rust is a 0.0.0 path dep into the golem-stuff clone (the 1.6 dev SDK);
# the crate is shaped for publication once the SDK releases.
publish = false

# Opt in to the workspace lints. Cargo's lint-table inheritance is per-package and opt-in, so
# without this stanza the crate silently ran WITHOUT `unreachable_pub`, `missing_docs`,
# `unwrap_used`, `expect_used` or `clippy::pedantic` — while CI still reported it as covered by
# `-p clank-embed ... -D warnings`. It was the only member of ten missing it, which is how the
# `pub(crate)` log-sink and the uncompilable doc example survived in exactly the crate whose job is
# to present a clean contract to embedders.
[lints]
workspace = true

# Plain rlib — this crate is a library other agent components link, never a component itself.

[features]
default = []
# The full Golem provider set (ask/mcp/agent-invoker/cluster). ask+mcp need the WASI-HTTP client;
# the invoker+cluster use only ungated golem-rust surface, but ship under the same umbrella so an
# embedder makes ONE decision: bare exploration shell vs the full clank command surface.
# The replay-safe log sink is NOT gated: it is std-only and every Golem embed needs it (the default
# append sink duplicates /var/log lines under oplog replay).
providers = ["dep:wasi-fetch", "dep:http", "dep:async-trait"]

[dependencies]
# The shell core. default-features=false drops `repl-driver`, so this links as a plain rlib WITHOUT
# the `wasi:cli/run` export that would clash with an embedding agent's golem:agent world (the same
# pattern clank-agent has always used).
clank-core = { path = "../clank-core", default-features = false }
# Default features only: `macro` is the load-bearing one (it makes `derive(Schema)` on the wire
# types resolve through golem-rust's re-export). Deliberately NOT `export_golem_agentic` — that
# feature compiles the SDK's own `Component` export into the build; the EMBEDDING agent crate is
# the one that must enable it, exactly once, on its own golem-rust dependency.
golem-rust = { workspace = true }
serde = { workspace = true }

# Behind `providers`: `http` types the headers these providers build; async-trait implements the
# ?Send seam traits. Both are target-agnostic, so they sit here.
http = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# Behind `providers`, and wasm-ONLY: `wasi-fetch` is the durable HTTP client for ask+mcp — a
# reqwest-shaped client over the wasip3 WASI-HTTP bindings, pinned exactly as upstream golem pins it
# in its own agent components. It replaced wstd, whose client panics under this SDK: wstd resolves
# its reactor from a thread-local only `wstd::block_on` installs, and golem-rust now drives agent
# methods with wit-bindgen's async runtime instead.
#
# The TARGET table is the point. This was gated by the Cargo FEATURE alone, unlike every other
# wasm/native HTTP split in the workspace (clank-core, whttp, wcurl, waget all use a target table).
# `cargo build -p clank-embed --features providers` therefore succeeded NATIVELY, linking a
# wasip3-only client into a host build — harmless only because nothing links that combination into
# a native binary today. A convention Cargo does not enforce is not a boundary.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasi-fetch = { workspace = true, optional = true }

[dev-dependencies]
# Native test harness: a current-thread runtime to drive the async Session, mirroring how the
# shell runs natively (clank-core's own `on_rt` pattern).
tokio = { version = "1", features = ["rt"] }
