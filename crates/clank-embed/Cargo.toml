[package]
name = "clank-embed"
version = "0.0.0"
edition = "2024"
license.workspace = true
repository.workspace = true
# Unpublishable while golem-rust is a 0.0.0 path dep into the golem-stuff clone (the 1.6 dev SDK);
# the crate is shaped for publication once the SDK releases.
publish = false

# Opt in to the workspace lints. Cargo's lint-table inheritance is per-package and opt-in, so
# without this stanza the crate silently ran WITHOUT `unreachable_pub`, `missing_docs`,
# `unwrap_used`, `expect_used` or `clippy::pedantic` — while CI still reported it as covered by
# `-p clank-embed ... -D warnings`. It was the only member of ten missing it, which is how the
# `pub(crate)` log-sink and the uncompilable doc example survived in exactly the crate whose job is
# to present a clean contract to embedders.
[lints]
workspace = true

# Plain rlib — this crate is a library other agent components link, never a component itself.

[features]
default = []
# The full Golem provider set (ask/mcp/agent-invoker/cluster). ask+mcp need `whttp` (the shared HTTP
# transport `wcurl`/`waget` and, natively, `clank-native`'s providers also use); the invoker+cluster
# use only ungated golem-rust surface, but ship under the same umbrella so an embedder makes ONE
# decision: bare exploration shell vs the full clank command surface.
# The replay-safe log sink is NOT gated: it is std-only and every Golem embed needs it (the default
# append sink duplicates /var/log lines under oplog replay).
providers = ["dep:whttp", "dep:http", "dep:async-trait"]

[dependencies]
# The shell core. default-features=false drops `repl-driver`, so this links as a plain rlib WITHOUT
# the `wasi:cli/run` export that would clash with an embedding agent's golem:agent world (the same
# pattern clank-agent has always used).
clank-core = { path = "../clank-core", default-features = false }
# Default features only: `macro` is the load-bearing one (it makes `derive(Schema)` on the wire
# types resolve through golem-rust's re-export). Deliberately NOT `export_golem_agentic` — that
# feature compiles the SDK's own `Component` export into the build; the EMBEDDING agent crate is
# the one that must enable it, exactly once, on its own golem-rust dependency.
golem-rust = { workspace = true }
serde = { workspace = true }

# Behind `providers`: `http` types the headers these providers build; async-trait implements the
# ?Send seam traits. Both are target-agnostic, so they sit here.
http = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# Behind `providers`, and wasm-ONLY: `whttp` is the shared HTTP transport for ask+mcp — the same
# one `wcurl`/`waget` use, and (natively) `clank-native`'s five provider implementations too. On
# THIS target it is backed by `wasi-fetch`, a reqwest-shaped client over the wasip3 WASI-HTTP
# bindings, pinned exactly as upstream golem pins it in its own agent components. `wasi-fetch`
# replaced wstd, whose client panics under this SDK: wstd resolves its reactor from a thread-local
# only `wstd::block_on` installs, and golem-rust now drives agent methods with wit-bindgen's async
# runtime instead.
#
# The TARGET table is the point. This dependency was gated by the Cargo FEATURE alone before ask+mcp
# routed through `whttp` here too, unlike every other wasm/native HTTP split in the workspace
# (clank-core, whttp itself, wcurl, waget all use a target table). `cargo build -p clank-embed
# --features providers` therefore used to succeed NATIVELY while linking a wasm-only client into a
# host build — harmless only because nothing linked that combination into a native binary. A
# convention Cargo does not enforce is not a boundary; `whttp` is itself dual-target (native reqwest
# / wasm wasi-fetch), so restricting it to this table here is deliberate, not incidental — this
# crate only ever needs whttp's wasm arm (clank-native owns the native-arm call sites).
[target.'cfg(target_arch = "wasm32")'.dependencies]
whttp = { path = "../../utilities/whttp", optional = true }

[dev-dependencies]
# Native test harness: a current-thread runtime to drive the async Session, mirroring how the
# shell runs natively (clank-core's own `on_rt` pattern).
tokio = { version = "1", features = ["rt"] }
