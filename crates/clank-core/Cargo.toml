[package]
name = "clank-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
# Pure rlib (R1): the native `clank` binary lives in clank-cli, and the wasm component is
# clank-agent — nothing consumed a cdylib artifact from this crate (verified against golem.yaml,
# scripts, and CI), so the standalone `wasi:cli/run` REPL component artifact is retired with it.
# The driver itself (`mod wasm`, gated behind a `repl-driver` feature no crate in the workspace
# enabled) was deleted with it — see git history to resurrect it.
crate-type = ["rlib"]

[dependencies]
# The shell core: `Session`, the builtins, the tools, authorization, the registry and the `Plugin`
# seam clank's families attach to. Re-exported whole from `lib.rs` (`pub use bash::*`), so every
# existing `clank_core::session::Session`-style path keeps resolving.
bash = { path = "../bash" }
# Brush itself is still a DIRECT dependency of this crate, not only of `bash`: `ai::model` is a
# hand-rolled `SimpleCommand` (brush-core's builtin traits) and `Clank::builtins` names
# `brush_core::builtins::Registration`, while `ai`/`mcp`/`grease`/`golem` each tokenize their own
# command line with brush-parser.
brush-core = "0.5"
brush-parser = "0.4"
# The `grease` package types + sha256/ed25519/RFC-6962 integrity verification, extracted to their own
# leaf crate so `dev-tools/grease-tool` can depend on just that instead of all of clank-core. Re-exported
# whole as `grease::pkg` (see crates/clank-core/src/grease/mod.rs) so no in-tree path changes.
grease-pkg = { path = "../grease-pkg" }
tokio = { version = "1", features = ["rt"] }
# Display-cell width for laying out the `ask` answer/tools boxes (emoji labels are 2 cells wide).
unicode-width = "0.1"
async-trait = "0.1"
# Parsing the agentic `ask` loop's tool-call arguments (the `shell` tool's JSON args) and MCP
# JSON-RPC. Pure Rust, dual-target-safe (no OS deps).
serde_json = "1"
# ask.toml (default model + provider config) read/write. serde derive + the toml crate are pure Rust
# (toml_edit/winnow, no OS deps) and compile on wasm32-wasip2.
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Structured subsystem errors (golem/grease/mcp/ai). Derive-only, no runtime and no OS deps, so it
# compiles unchanged for wasm32-wasip2. Lets a failure carry its KIND — retryable transport vs remote
# fault vs malformed request — instead of collapsing to a String the caller can only print.
thiserror = "2"
sha2 = "0.11.0"
# grease package signing: ed25519 detached-signature VERIFICATION only (no keygen/signing), so no
# RNG/getrandom is needed and the crate builds clean on wasm32-wasip2. `subtle`/`zeroize` (dalek's
# deps) are already in the tree. `default-features = false` drops the `rand_core`/`std` extras.
ed25519-dalek = { version = "2", default-features = false }
# base64 decoding for the signature + public key (already a transitive dep; pure Rust, dual-target).
base64 = "0.22"

[dev-dependencies]
# The shell core's test fixtures (`on_rt`, the process-cwd lock, `LogCapture`) and the test-only
# `Session::set_context_cap`. The family suites drive a real `Session`, so they need the same
# harness the core's own suite uses — it lives behind a feature rather than in a `dev-dependency`
# cycle back to this crate.
bash = { path = "../bash", features = ["test-support"] }
# Signing side of ed25519 (SigningKey), for tests that produce a signed fixture payload to exercise
# the verify-only install path. Dev-only, native — never in the wasm agent build. `from_bytes` on a
# fixed 32-byte seed keeps it deterministic with no RNG.
ed25519-dalek = { version = "2" }

# Native-only dev dep: the `CLANK_MCP_BIN` override test builds a throwaway directory.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
