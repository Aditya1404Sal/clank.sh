[package]
name = "waget"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# Both a library (embedded by clank-core and any other wasm component) and a standalone CLI binary.
[lib]
path = "src/lib.rs"

[[bin]]
name = "waget"
path = "src/main.rs"

[dependencies]
# `http::Method` in the parsed request; `whttp` is the shared cfg-gated transport
# (wasi-fetch/reqwest) plus redirect following + timeouts, so waget only parses flags and formats
# output.
http = "1"
whttp = { path = "../whttp" }

# wasm: `wasip3` re-exports the wit-bindgen whose async runtime drives whttp's wasi-fetch futures,
# and that runtime's `block_on` is what the standalone bin's `main` needs. It must be THIS
# wit-bindgen (the one wasip3 pins), not golem-rust's fork, or the futures would be polled by a
# runtime that never receives their wakeups. The library's HTTP lives in whttp; this dep is only
# the bin's runtime.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasip3 = "0.7"

# native: tokio gives the standalone bin a runtime. (reqwest moved to whttp.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
