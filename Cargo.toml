[workspace]
resolver = "2"
members = [
    "crates/bash",
    "crates/clank-core",
    "crates/grease-pkg",
    "crates/clank-cli",
    "crates/clank-embed",
    "crates/clank-native",
    "crates/clank-agent",
    "crates/clank-conformance",
    "utilities/whttp",
    "utilities/wcurl",
    "utilities/waget",
    "dev-tools/grease-tool",
    "dev-tools/fork-inventory",
    "fixtures/greeter-agent",
    # T1 PROBE — THROWAWAY: the tool provider the probe calls. Deliberately NOT in default-members,
    # like greeter-agent: it is a wasm-only cdylib component.
    "fixtures/probe-tool",
    # T2 FIXTURE: the tool every agent-tools ticket tests against. wasm-only cdylib, so like the
    # other component fixtures it stays out of default-members.
    "fixtures/echo-tool",
    # the `bash` tool component (`clank:bash`). wasm-only cdylib, so like the component fixtures it
    # stays out of default-members.
    "crates/bash-tool",
]
# main-rc-1: exclude the vendored golem clone so its crates (golem-schema, etc.) resolve their
# `{ workspace = true }` deps against THEIR OWN workspace (golem-stuff/golem/), not clank's root.
# `fork/coreutils` for the same reason: it is uutils' own workspace (a git submodule), and its
# crates inherit `version`/`edition`/deps from ITS root. Without this, cargo would also claim them
# as members here — every path dependency inside a workspace's directory becomes one implicitly.
exclude = ["golem-stuff", "fork/coreutils"]
# default-members excludes the two wasm-only component crates, so a bare native `cargo build`
# is green: greeter-agent is an e2e fixture (the second implementer of the embed surface), and
# clank-agent's cdylib links only for wasm32-wasip2 (its golem/wasi host imports are undefined
# natively — the link has never succeeded on native). `--workspace`, explicit `-p`, and the
# golem deploy path still build both for wasm.
default-members = [
    "crates/bash",
    "crates/clank-core",
    "crates/grease-pkg",
    "crates/clank-cli",
    "crates/clank-embed",
    "crates/clank-native",
    "crates/clank-conformance",
    "utilities/whttp",
    "utilities/wcurl",
    "utilities/waget",
    "dev-tools/grease-tool",
    "dev-tools/fork-inventory",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/clank-sh/clank.sh"

[workspace.dependencies]
wasip3 = "0.7"
wit-bindgen = { version = "0.57", default-features = false, features = ["async"] }
futures = "0.3"

# The dev golem SDK. Declared ONCE here because it was previously copy-pasted into three manifests
# (clank-agent, clank-embed, greeter-agent) and a path that appears three times is a path that gets
# updated twice.
#
# The path stays ABSOLUTE, deliberately. `~/Desktop/clank-spike` is a git worktree, and mixing
# relative and absolute path-dep forms across a worktree has produced a cargo "package collision in
# the lockfile". Making this relocatable is a separate change that needs verifying on a fresh clone;
# the defect fixed here is the repetition, not the absoluteness.
#
# Feature note: `export_golem_agentic` is NOT enabled here. It compiles the SDK's own `Component`
# export, which exactly one crate in a component may do — so the two leaf agent crates add it
# themselves and clank-embed (a library) must not.
golem-rust = { path = "/Users/adityasalunkhe/Desktop/clank.sh/golem-stuff/golem/sdks/rust/golem-rust" }

# Shared across three or more members. `http` and `serde` in particular were drifting toward
# per-crate version strings; one entry is one place to change them.
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
wasi-fetch = "=0.2.0"

# Workspace-wide lints (audit C1, full set). Every member opts in via `[lints] workspace = true`.
# Warn-level only: these surface debt on every build without breaking it; burn down over time.
[workspace.lints.rust]
unsafe_code = "warn"     # not "forbid": clank has ~7 real SAFETY-documented unsafe blocks
unreachable_pub = "warn" # surfaces the pub-vs-pub(crate) gap (audit C3); tighten after R1 settles
missing_docs = "warn"    # clank-core is a real library (rlib consumed by agent/conformance)

[workspace.lints.clippy]
# Groups sit at lower priority so the individual lints below always win (cargo's required form).
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn" # the highest-value lint for THIS codebase — ~470 non-test unwrap/expect sites
expect_used = "warn"

# uucore's upstream 0.9.0 fails to build on wasm32-wasip2 (uses the unstable `wasip2` std
# feature). Our fork adds a stable encoded-bytes shim. This redirects every transitive uucore
# (via the uu_* coreutils crates) to the patched fork on both targets.
[patch.crates-io]
# reedline (the native REPL's line editor) forked for ONE fix: its `initialize_prompt_position`
# propagates a `cursor::position()` timeout with `?`, so a terminal that answers the DSR query late
# (right after a burst like `ask`'s output) aborts read_line and drops the shell into a degraded
# fallback. The fork makes that one call tolerant — fall back to (col 0, bottom row), which is
# correct because clank always ends output in a newline. Vendored (not a git dep) because it is the
# exact published 0.38.0 source plus a one-line patch; native-only, never in the wasm build. See
# fork/reedline/src/painting/painter.rs. To productionize, push it as a github fork and consume it
# the way coreutils is below (a submodule under fork/) or brush is (a `git` + `rev` pin).
reedline = { path = "fork/reedline" }

# crossterm forked for ONE fix, paired with the reedline fork above. crossterm's cursor::position()
# (which reedline calls in initialize_prompt_position) and its keyboard-enhancement probe poll for a
# terminal DSR reply with a 2000ms ceiling — a terminal that answers late (right after `ask` dumps a
# burst of output) makes that query block ~1s every prompt. The fork cuts both ceilings to 250ms so
# the query fails fast; the reedline fork then falls back to (col 0, bottom row) immediately
# instead of stalling. A responsive terminal replies in <10ms, far inside the window, so it is
# unaffected. Vendored (published 0.28.1 source + two one-line timeout changes), native-only, never
# in the wasm build. Only affects crossterm 0.28 (reedline's); brush's crossterm 0.25 is a different
# version and is left untouched. See fork/crossterm/src/cursor/sys/unix.rs + terminal/sys/unix.rs.
crossterm = { path = "fork/crossterm" }

# The coreutils fork carries wasip2 fixes: a stable OsStr encoded-bytes shim + empty-argv guard in
# uucore, and a wasi `set_permissions` skip in uu_cp. Patch uucore AND every uu_* command crate
# clank registers — the published uu_* crates only share the patched `uucore`, so a fix inside a
# command crate (e.g. cp) is only picked up when that command crate itself comes from the fork.
#
# Consumed by PATH from `fork/coreutils`, a git submodule tracking the fork's `wasip2-oscompat`
# branch — not as a `git` + `rev` dependency. The pin did not go away, it moved: the superproject's
# gitlink records the exact fork commit, so the build is still reproducible from source control
# alone (audit P2-7), and a fork fix is now an edit + commit in place instead of a push + rev-bump
# round-trip. Clone with `--recurse-submodules` (or run `git submodule update --init` afterwards).
# The gitlink must name a commit that exists on GitHub before CI or a fresh clone can fetch it.
uucore = { path = "fork/coreutils/src/uucore" }
uu_cat = { path = "fork/coreutils/src/uu/cat" }
uu_ls = { path = "fork/coreutils/src/uu/ls" }
uu_wc = { path = "fork/coreutils/src/uu/wc" }
uu_head = { path = "fork/coreutils/src/uu/head" }
uu_sort = { path = "fork/coreutils/src/uu/sort" }
uu_mkdir = { path = "fork/coreutils/src/uu/mkdir" }
uu_rm = { path = "fork/coreutils/src/uu/rm" }
uu_mv = { path = "fork/coreutils/src/uu/mv" }
uu_cp = { path = "fork/coreutils/src/uu/cp" }
uu_env = { path = "fork/coreutils/src/uu/env" }
uu_cut = { path = "fork/coreutils/src/uu/cut" }
uu_tr = { path = "fork/coreutils/src/uu/tr" }
uu_uniq = { path = "fork/coreutils/src/uu/uniq" }
uu_tail = { path = "fork/coreutils/src/uu/tail" }
uu_tee = { path = "fork/coreutils/src/uu/tee" }
uu_touch = { path = "fork/coreutils/src/uu/touch" }
uu_sleep = { path = "fork/coreutils/src/uu/sleep" }
uu_printf = { path = "fork/coreutils/src/uu/printf" }
# Published brush-core 0.5.0 stores redirect targets as `OpenFile::File(std::fs::File)` and clones
# them via `File::try_clone()`, which is Unsupported on wasm32-wasip2 — so `echo > file` silently
# discards the write. Upstream `main` refactored `OpenFile::File` to `Arc<File>` (clone = `Arc::clone`,
# no syscall), which fixes file redirects on wasip2, but that fix isn't on crates.io yet.
#
# The `std-utils` branch (stacked on `wall-c-wasm-pipes`, branched from 0300a84) carries the wasm32
# changes: std::io::pipe() is unsupported on wasip2 and there's no blocking thread pool, so on wasm
# both pipelines ("Wall C") AND command substitution `$(...)` AND here-documents/here-strings
# (`<<EOF`/`<<<`) use an in-memory `OpenFile::Stream`-backed pipe with inline-sequential execution
# (the producer completes and drops its writer → clean EOF for the reader) instead of OS pipes +
# tokio::spawn/spawn_blocking. Native behavior is unchanged. See memory wall-c-pipe-concurrency-path.
# Pin all three brush crates (one monorepo; lockstep) to the exact commit.
brush-core = { git = "https://github.com/Aditya1404Sal/brush", rev = "02de798" }
brush-builtins = { git = "https://github.com/Aditya1404Sal/brush", rev = "02de798" }
brush-parser = { git = "https://github.com/Aditya1404Sal/brush", rev = "02de798" }
