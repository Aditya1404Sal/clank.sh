# Pin the edition so `cargo fmt` is deterministic across contributor toolchains. Style otherwise
# follows rustfmt defaults; tighten here once the project settles a house style (audit P2-5 / C1).
#
# Note: `[workspace.lints]` IS enabled now (root Cargo.toml — clippy::pedantic, unwrap_used,
# expect_used, missing_docs, unreachable_pub, unsafe_code), at warn level, promoted to hard failures
# by CI's `-- -D warnings`. This comment previously said the opposite; it predated the lints landing.
# Inheritance is per-package and opt-in, so every member needs `[lints] workspace = true` — a member
# missing that stanza runs unlinted while CI still reports it as covered.
edition = "2021"
