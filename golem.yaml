# yaml-language-server: $schema=https://schema.golem.cloud/app/golem/1.6.0-dev.9/golem.schema.json
# clank.sh Golem application: the `clank:agent` component (crates/clank-agent) wraps the shell
# Session as a durable agent instance. Build/deploy with `golem build` / `golem deploy`.

manifestVersion: 1.6.0

app: clank

environments:
  local:
    server: local
    componentPresets: debug
  cloud:
    server: cloud
    componentPresets: release

components:
  clank:agent:
    dir: crates/clank-agent
    templates: rust
    env:
      # Anthropic API key for the `ask` command's durable LLM provider, passed through from the host
      # environment at deploy time (Jinja substitution, resolved against the shell running
      # `golem deploy`). Substitution is strict — the host var must be defined — so the golem-e2e
      # exports an empty default before deploying; with an empty/unset key `ask` reports "not
      # configured" (exit 4) and the e2e skips its network assertions.
      ANTHROPIC_API_KEY: "{{ ANTHROPIC_API_KEY }}"
      # Safety cap (estimated tokens) for the in-memory session transcript. When the window exceeds
      # this, the oldest entries are auto-evicted and summarized (leading-edge auto-compaction). This
      # is the only knob — there is no `context` subcommand to change it at runtime. Edit this value to
      # tune the cap; a non-positive/unset value falls back to the built-in default (24000). A literal
      # (not a host passthrough), so no host var is required to deploy.
      CLANK_CONTEXT_CAP_TOKENS: "24000"
  # A minimal second agent (fixtures/greeter-agent) deployed alongside clank:agent purely to be the
  # target of a grease-installed agent invocation — proving clank's WasmRpcInvoker wRPC round-trips.
  greeter:agent:
    dir: fixtures/greeter-agent
    templates: rust
  # T1 PROBE — THROWAWAY. A minimal tool provider (fixtures/probe-tool) so the probe has a real
  # Golem tool to invoke over tool-rpc. Remove with the probe.
  probe:tool:
    dir: fixtures/probe-tool
    templates: rust
  # T2 FIXTURE (fixtures/echo-tool): the tool the agent-tools tickets are tested against. Its
  # commands between them declare every construct the CLI projection has to parse.
  echo:tool:
    dir: fixtures/echo-tool
    templates: rust
  # SPIKE — the `bash` tool walking skeleton (crates/bash): clank's shell core as a Golem tool,
  # bound to ClankAgent below so the probe builtin can call it over tool-rpc.
  clank:bash:
    dir: crates/bash
    templates: rust

# T1 PROBE — THROWAWAY. Tool declarations. `capable-probe` declares a provisioned file, which is
# what implies the filesystem grant today (gol-33 §Filesystem capability classification); the
# binding-level `filesystemAccess` key arrives with upstream PR #3842.
tools:
  probe: {}
  capable-probe:
    files:
      - sourcePath: fixtures/probe-tool/marker
        targetPath: /.probe/MARKER
  echo-tool: {}
  # The fixture's filesystem-capable tool: the provisioned marker is what implies the grant today.
  capable-echo:
    files:
      - sourcePath: fixtures/echo-tool/marker
        targetPath: /.echo/MARKER
  # `tree` is echo-tool's subcommand SUBTREE, not a tool anyone should bind. It has to be declared
  # anyway: a subtree child carries its own `#[tool_implementation]`, which registers it in the
  # guest tool registry — that is how the parent forwards `tree add` to it in-process, via
  # `get_tool_invoker_by_name` — and nothing filters that registry before `discover-tools`, so
  # deploy rejects it as "a discovered tool with no matching top-level declaration". Every subtree
  # therefore leaks into the manifest as a peer of its parent. Deliberately NOT bound to
  # ClankAgent: the parent reaches it directly, and binding it would let a caller bypass
  # `echo-tool` and invoke the subtree on its own.
  tree: {}
  # SPIKE — a provisioned file is what makes a tool filesystem-capable on golem main today (a
  # binding with nothing set and no files leaves it with no filesystem at all — measured live).
  bash:
    files:
      - sourcePath: crates/bash/marker
        targetPath: /.bash/MARKER

# T1 PROBE — THROWAWAY. The bindings: which tools ClankAgent may invoke. A binding is compiled per
# agent type at deploy time, so nothing inside a running agent can create one.
agents:
  ClankAgent:
    tools:
      probe: {}
      capable-probe: {}
      echo-tool: {}
      capable-echo: {}
      bash: {}
