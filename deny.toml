# `cargo deny check` configuration. NOT part of the build — run explicitly in CI / at release.
# Formalizes the supply-chain posture the audit called out (P2-5, P2-7): advisories are surfaced,
# licenses are allowlisted, and the only permitted git sources are the two deliberately-pinned forks.

[advisories]
version = 2
yanked = "warn"
# Report every RUSTSEC advisory. Add `ignore = ["RUSTSEC-YYYY-NNNN"]` here only after triage, with a
# comment justifying why the advisory does not apply.
ignore = [
    # `fxhash` — unmaintained, NO known vulnerability (RUSTSEC-2025-0057). Transitive-only, buried in
    # the dep tree; no maintained drop-in without a wider swap. Re-triage if a real advisory lands.
    "RUSTSEC-2025-0057",
    # `instant` — unmaintained, NO known vulnerability (RUSTSEC-2024-0384). Transitive-only (arrives
    # via a third-party dep we don't control; `web-time` is the successor). Re-triage on a real vuln.
    "RUSTSEC-2024-0384",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Narrowly-scoped per-crate exceptions for UNAVOIDABLE transitive deps whose license isn't in the
# allow-list above. Each is a deliberate, reviewed acceptance (audit follow-up), NOT a blanket allow.
exceptions = [
    # `terminfo` is WTFPL (Do-What-The-F*ck-You-Want — maximally permissive); pulled transitively by
    # the interactive TUI (inquire / reedline).
    { name = "terminfo", allow = ["WTFPL"] },
    # Mozilla's CA root bundle under CDLA-Permissive-2.0 (a permissive data license); pulled by
    # reqwest + rustls for native TLS trust roots.
    { name = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
    { name = "webpki-root-certs", allow = ["CDLA-Permissive-2.0"] },
    # `golem-wasm` is the Golem platform's own crate under BUSL-1.1 (Business Source License —
    # SOURCE-AVAILABLE, not OSI-open-source). Unavoidable for a Golem component and accepted as a
    # deliberate platform dependency. Its manifest omits an SPDX field, so the `clarify` below names
    # the license from its bundled LICENSE file.
    { name = "golem-wasm", allow = ["BUSL-1.1"] },
]

# `golem-wasm` ships a LICENSE file but no `license =` field, so cargo-deny can't infer the SPDX id.
# State it explicitly (BUSL-1.1), keyed to the LICENSE file's content hash.
[[licenses.clarify]]
name = "golem-wasm"
expression = "BUSL-1.1"
license-files = [{ path = "LICENSE", hash = 0x3b72166b }]

[bans]
# A shell that vendors a large dependency tree should notice version drift and stray wildcards.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Only crates.io and the two known, deliberately-pinned forks are allowed. Any OTHER git source is a
# hard fail — this is the enforcement mechanism behind P2-7: pulling in a fork must be an explicit,
# reviewed decision, not something a stray dependency edit can do silently.
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Aditya1404Sal/coreutils",
    "https://github.com/Aditya1404Sal/brush",
]
