# Vendored fork of crossterm 0.28.1 (the published crates.io source) carrying ONE clank change:
# the DSR round-trip timeouts in src/cursor/sys/unix.rs and src/terminal/sys/unix.rs are cut from
# 2000ms to 250ms so a terminal that answers late (e.g. right after `ask`'s output burst) fails
# fast instead of stalling the prompt ~1-2s. Pairs with the reedline-fork tolerant-fallback patch.
# Trimmed to the buildable crate: examples/, docs/, and dev-dependencies (used only by those) are
# removed, and auto-discovery is turned off so cargo does not look for the deleted files.
[package]
edition = "2021"
rust-version = "1.63.0"
name = "crossterm"
version = "0.28.1"
authors = ["T. Post"]
description = "A crossplatform terminal library for manipulating terminals."
documentation = "https://docs.rs/crossterm/"
license = "MIT"
repository = "https://github.com/crossterm-rs/crossterm"
autoexamples = false
autobenches = false
autotests = false

[package.metadata.docs.rs]
all-features = true

[lib]
name = "crossterm"
path = "src/lib.rs"

[dependencies.bitflags]
version = "2.3"

[dependencies.futures-core]
version = "0.3"
optional = true
default-features = false

[dependencies.parking_lot]
version = "0.12"

[dependencies.serde]
version = "1.0"
features = ["derive"]
optional = true

[features]
bracketed-paste = []
default = [
    "bracketed-paste",
    "windows",
    "events",
]
event-stream = [
    "dep:futures-core",
    "events",
]
events = [
    "dep:mio",
    "dep:signal-hook",
    "dep:signal-hook-mio",
]
serde = [
    "dep:serde",
    "bitflags/serde",
]
use-dev-tty = [
    "filedescriptor",
    "rustix/process",
]
windows = [
    "dep:winapi",
    "dep:crossterm_winapi",
]

[target."cfg(unix)".dependencies.filedescriptor]
version = "0.8"
optional = true

[target."cfg(unix)".dependencies.libc]
version = "0.2"
optional = true
default-features = false

[target."cfg(unix)".dependencies.mio]
version = "1.0"
features = ["os-poll"]
optional = true

[target."cfg(unix)".dependencies.rustix]
version = "0.38.34"
features = [
    "std",
    "stdio",
    "termios",
]
default-features = false

[target."cfg(unix)".dependencies.signal-hook]
version = "0.3.17"
optional = true

[target."cfg(unix)".dependencies.signal-hook-mio]
version = "0.2.4"
features = ["support-v1_0"]
optional = true

[target."cfg(windows)".dependencies.crossterm_winapi]
version = "0.9.1"
optional = true

[target."cfg(windows)".dependencies.winapi]
version = "0.3.9"
features = [
    "winuser",
    "winerror",
]
optional = true
